<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — AUREON</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0f172a;
    --bg2:      #1e293b;
    --card:     rgba(255,255,255,0.06);
    --border:   rgba(255,255,255,0.10);
    --blue:     #1f75fe;
    --blue-h:   #155dc3;
    --text:     #f1f5f9;
    --muted:    #94a3b8;
    --input-bg: rgba(255,255,255,0.05);
    --error:    #f87171;
    --success:  #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 0;
    color: var(--text);
  }

  body::before {
    content: "";
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(31,117,254,0.2), transparent 70%);
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    bottom: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,200,255,0.15), transparent 70%);
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 16px;
    animation: fadeUp .5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand img {
    width: 52px;
    margin-bottom: 10px;
  }
  .brand h1 {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--text);
  }
  .brand p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--text);
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: var(--blue); }
  .field input.err   { border-color: var(--error); }

  /* Password strength */
  .strength-bar {
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    margin-top: 8px;
    overflow: hidden;
  }
  .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width .3s, background .3s;
  }
  .strength-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    min-height: 14px;
  }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s ease;
    font-family: 'Inter', sans-serif;
  }
  .btn-primary {
    background: var(--blue);
    color: white;
    margin-top: 8px;
  }
  .btn-primary:hover    { background: var(--blue-h); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-outline:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.2);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--muted);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .msg {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
  }
  .msg.error   { background: rgba(248,113,113,.12); color: var(--error);   border: 1px solid rgba(248,113,113,.25); display: block; }
  .msg.success { background: rgba(74,222,128,.12);  color: var(--success); border: 1px solid rgba(74,222,128,.25);  display: block; }

  /* Checklist de requisitos */
  .reqs {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .req {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--muted);
    transition: .2s;
  }
  .req.ok {
    background: rgba(74,222,128,.12);
    border-color: rgba(74,222,128,.3);
    color: var(--success);
  }

  .terms {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }
  .terms a { color: var(--blue); text-decoration: none; }

  .links {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .links a { color: var(--blue); text-decoration: none; font-weight: 500; }
  .links a:hover { text-decoration: underline; }

  .icon { width: 18px; height: 18px; flex-shrink: 0; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="brand">
    <img src="/static/AureonWeb_150px.png" alt="Aureon">
    <h1>AUREON</h1>
    <p>Crea tu cuenta para acceder al ecosistema</p>
  </div>

  <div class="card">
    <div class="card-title">Crear cuenta</div>

    <div id="msg" class="msg"></div>

    <!-- OAuth rápido -->
    <button class="btn btn-outline" onclick="registerOAuth('google')">
      <svg class="icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuar con Google
    </button>

    <button class="btn btn-outline" onclick="registerOAuth('github')">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8c.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/>
      </svg>
      Continuar con GitHub
    </button>

    <div class="divider">o regístrate con email</div>

    <form id="register-form" onsubmit="registerEmail(event)">
      <div class="field">
        <label>Nombre completo</label>
        <input type="text" id="name" placeholder="Juan García" autocomplete="name" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="tu@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••"
               autocomplete="new-password" required oninput="checkStrength(this.value)">
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-label" id="strength-label"></div>
        <div class="reqs">
          <span class="req" id="req-len">8+ caracteres</span>
          <span class="req" id="req-upper">Mayúscula</span>
          <span class="req" id="req-num">Número</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="btn-register">
        Crear cuenta
      </button>
    </form>

    <p class="terms">
      Al registrarte aceptas los
      <a href="#">Términos de servicio</a> y la
      <a href="#">Política de privacidad</a> de Aureon.
    </p>
  </div>

  <div class="links">
    ¿Ya tienes cuenta? <a href="/auth/login{{ '?redirect=' + redirect if redirect else '' }}">Iniciar sesión</a>
  </div>
</div>

<script>
  const params   = new URLSearchParams(location.search);
  const redirect = params.get('redirect') || '/';

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className   = 'msg ' + type;
  }

  function setLoading(loading) {
    const btn = document.getElementById('btn-register');
    btn.disabled  = loading;
    btn.innerHTML = loading
      ? '<span class="spinner"></span> Creando cuenta...'
      : 'Crear cuenta';
  }

  // ── Password strength ──────────────────────────────────
  function checkStrength(val) {
    const hasLen   = val.length >= 8;
    const hasUpper = /[A-Z]/.test(val);
    const hasNum   = /[0-9]/.test(val);
    const score    = [hasLen, hasUpper, hasNum].filter(Boolean).length;

    document.getElementById('req-len').classList.toggle('ok', hasLen);
    document.getElementById('req-upper').classList.toggle('ok', hasUpper);
    document.getElementById('req-num').classList.toggle('ok', hasNum);

    const fill   = document.getElementById('strength-fill');
    const label  = document.getElementById('strength-label');
    const colors = ['', '#f87171', '#fb923c', '#4ade80'];
    const labels = ['', 'Débil', 'Regular', 'Segura'];

    fill.style.width      = (score * 33.3) + '%';
    fill.style.background = colors[score] || '';
    label.textContent     = score > 0 ? labels[score] : '';
    label.style.color     = colors[score] || '';
  }

  // ── Registro con email ────────────────────────────────
  async function registerEmail(e) {
    e.preventDefault();
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    setLoading(true);
    try {
      const res  = await fetch('/auth/register', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ name, email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        const detail = data.details ? ' — ' + data.details.join(', ') : '';
        showMsg((data.error || 'Error al crear cuenta') + detail, 'error');
        return;
      }

      localStorage.setItem('aureon_token',   data.access_token);
      localStorage.setItem('aureon_refresh', data.refresh_token);

      showMsg('¡Cuenta creada! Revisa tu email para verificarla.', 'success');
      setTimeout(() => { window.location.href = redirect; }, 1500);

    } catch (err) {
      showMsg('Error de conexión. Intenta de nuevo.', 'error');
    } finally {
      setLoading(false);
    }
  }

  // ── OAuth ─────────────────────────────────────────────
  function registerOAuth(provider) {
    window.location.href = `/auth/oauth/${provider}?redirect=${encodeURIComponent(redirect)}`;
  }
</script>
</body>
</html>
