services:
  - type: web
    name: AUREON_WEB
    env: python
    region: oregon
    branch: main
    repo: https://github.com/medadsthilaire23/AUREON_WEB
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    plan: free
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        sync: false          # se llena manualmente en Render dashboard
      - key: APP_URL
        sync: false          # https://tu-app.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false          # tu-app.onrender.com (sin https://)
      - key: WEBAUTHN_ORIGIN
        sync: false          # https://tu-app.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false          # auth@tudominio.com
    healthCheckPath: /