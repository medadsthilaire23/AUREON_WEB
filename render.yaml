services:
  - type: web
    name: AUREON_WEB
    env: python
    region: oregon
    branch: main
    repo: https://github.com/medadsthilaire23/AUREON_WEB

    buildCommand: pip install -r requirements.txt

    # 🔥 Factory pattern correcto
    startCommand: gunicorn "app:create_app()" --workers 1 --timeout 180

    plan: free
    autoDeploy: true

    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        sync: false

      # 🔴 CRÍTICO: base de datos real
      - key: DATABASE_URL
        sync: false

      - key: APP_URL
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GITHUB_CLIENT_ID
        sync: false

      - key: GITHUB_CLIENT_SECRET
        sync: false

      - key: WEBAUTHN_RP_ID
        sync: false

      - key: WEBAUTHN_ORIGIN
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: EMAIL_FROM
        sync: false

    # 🔍 Health check real
    healthCheckPath: /health