# alembic.ini — AUREON
# ══════════════════════════════════════════════════════════════════════════════
# Configuración de Alembic para migraciones de base de datos.
# La URL real se inyecta desde env.py usando DATABASE_URL del entorno.
# ══════════════════════════════════════════════════════════════════════════════

[alembic]
script_location = migrations

# URL placeholder — env.py la sobreescribe con DATABASE_URL
sqlalchemy.url = postgresql://user:pass@localhost/aureon

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S